<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZILOG Z80</title>
    <meta name="description" content="Ссылки на YouTube и GitHub канала ZILOG Z80">
    <style>
:root {
        --dark-purple: #4b0082;
        --dark-blue: #00008b;
        --background-color: #000000;
        --text-color: #ffffff;
    }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 10px;
            object-fit: cover;
        }

        body {
            margin: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 25px;
            background: rgba(10, 5, 20, 0.75);
            border-radius: 10px;
            border: 1px solid var(--dark-purple);
            box-shadow: 0 0 15px rgba(75, 0, 130, 0.5);
        }

        h1 {
            color: var(--dark-purple);
            margin-bottom: 1rem;
            font-size: 1.9rem;
            text-shadow: 0 0 18px rgba(168, 85, 247, .55);
            margin-bottom: 0.15rem;
        }

        h3 {
            color: var(--dark-blue);
            margin-bottom: 1rem;
            animation: pulse 5s ease-in-out infinite;
            margin: 0;
        }

        .socials {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        .icon-btn {
            display: inline-grid;
            place-items: center;
            width: 46px;
            height: 46px;
            border-radius: 12px;
            color: #fff;
            transition: transform .15s, filter .15s, box-shadow .15s;
        }

        .icon-btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.15);
        }

        .icon-btn:focus-visible {
            outline: 2px solid var(--accent-purple);
            outline-offset: 3px;
        }

        .icon-btn svg {
            width: 22px;
            height: 22px;
        }

        .icon-btn.yt {
            background: #FF0000;
            box-shadow: 0 0 12px rgba(255, 0, 0, .45);
        }

        .icon-btn.gh {
            background: #24292e;
            border: 1px solid #444c52;
            box-shadow: 0 0 12px rgba(255, 255, 255, .12);
        }

        @media (prefers-reduced-motion: reduce) {
            .icon-btn:hover {
                transform: none;
            }
        }
        @keyframes pulse {
            0%, 100% {
                color: var(--dark-blue);
                text-shadow: 0 0 6px rgba(0, 0, 139, .6);
            }
            50% {
                color: #86efac;
                text-shadow: 0 0 16px rgba(134, 239, 172, .75);
            }
        }
        .profile-row {
            display: flex;
            align-items: center;
            /* вертикальное выравнивание */
            gap: 1rem;
            /* расстояние между авой и текстом */
            margin-bottom: 1.5rem;
            /* отступ снизу */
        }
        .divider-line {
            width: 80%;
            border: 1px solid var(--dark-purple);
            margin: 1rem auto;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="profile-row">
            <img class="avatar" src="ava.jpg" alt="Аватар">
            <div style="margin:0;">
                <h1>ZILOG Z80</h1>
                <h3>/⁠ᐠ⁠｡⁠ꞈ⁠｡⁠ᐟ⁠\</h3>
            </div>
        </div>

        <hr class="divider-line">
        <p>
            Эта страница создана из-за того, что у меня не уместились ссылки на YouTube и GitHub
            в описании профиля
        </p>
        <div class="socials">
            <a href="https://www.youtube.com/@ZILOGzZ80" target="_blank" rel="noopener" class="icon-btn yt" aria-label="YouTube">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31.3 31.3 0 0 0 0 12a31.3 31.3 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31.3 31.3 0 0 0 24 12a31.3 31.3 0 0 0-.5-5.8zM9.6 15.6V8.4l6.3 3.6-6.3 3.6z" />
                </svg>
            </a>
            <a href="https://github.com/ZILOGZ80000" target="_blank" rel="noopener" class="icon-btn gh" aria-label="GitHub">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 .5a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.7 2.7 1.2 3.4.9.1-.7.4-1.2.7-1.5-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0C17.3 4.7 18.3 5 18.3 5c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .4.2.7.8.6A11.5 11.5 0 0 0 12 .5z" />
                </svg>
            </a>
        </div>
    </div>
</body>
</html>
